# Server Configuration
server.port=8080
server.servlet.context-path=/

# Logging Configuration
logging.level.com.platypass=INFO
logging.level.org.springframework.web=INFO

# AI Provider Configuration
# OpenAI Configuration
ai.openai.api-key=${OPENAI_API_KEY:}
ai.openai.base-url=${OPENAI_BASE_URL:https://api.openai.com}

# Anthropic Configuration
ai.anthropic.api-key=${ANTHROPIC_API_KEY:}
ai.anthropic.base-url=${ANTHROPIC_BASE_URL:https://api.anthropic.com}

# Google Gemini Configuration
ai.google.api-key=${GOOGLE_API_KEY:}
ai.google.base-url=${GOOGLE_BASE_URL:https://generativelanguage.googleapis.com}

# Jackson Configuration
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false
